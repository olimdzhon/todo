version: "3.3"

services:
  postgres:
    image: postgres:15-alpine
    container_name: todo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todopass123}
      POSTGRES_DB: ${POSTGRES_DB:-todos_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d todos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: todo-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-todouser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-todopass123}
      DB_NAME: ${POSTGRES_DB:-todos_db}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - todo-network
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: todo-frontend
    ports:
      - "3000:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - todo-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  todo-network:
    driver: bridge
