<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📝 TODO List</h1>
        
        <div class="add-todo">
            <input type="text" id="todoTitle" placeholder="Название задачи..." />
            <input type="text" id="todoDescription" placeholder="Описание (опционально)..." />
            <button onclick="addTodo()">Добавить</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterTodos('all')">Все</button>
            <button class="filter-btn" onclick="filterTodos('active')">Активные</button>
            <button class="filter-btn" onclick="filterTodos('completed')">Завершённые</button>
        </div>

        <div id="todoList" class="todo-list"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
